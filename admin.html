<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>The Best — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Tajawal:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- login -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <p class="brand">The Best</p>
      <p class="hand">admin workshop</p>
      <div id="login-mode-note" class="note"></div>
      <label class="fld" id="email-wrap"><span>Email</span><input id="login-email" type="email" autocomplete="username"></label>
      <label class="fld"><span>Password</span><input id="login-pass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary block" type="submit">Sign in</button>
      <p class="err" id="login-err"></p>
      <a class="muted-link" href="index.html">← Back to the store</a>
    </form>
  </section>

  <!-- app -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <div class="side-brand"><span class="brand">The Best</span><span class="hand">admin</span></div>
      <nav>
        <a href="#dashboard" data-nav="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-3H4z"/></svg>Dashboard</a>
        <a href="#add" data-nav="add" class="hl"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add products</a>
        <a href="#products" data-nav="products"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Products</a>
        <a href="#categories" data-nav="categories"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg>Categories</a>
        <a href="#orders" data-nav="orders"><svg viewBox="0 0 24 24"><path d="M5 7h14l-1.5 11h-11z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Orders<span class="pill" id="orders-new"></span></a>
        <a href="#settings" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</a>
      </nav>
      <div class="side-foot">
        <a href="index.html" target="_blank" class="btn ghost block">View store ↗</a>
        <button class="btn ghost block" id="logout">Sign out</button>
        <p class="mode" id="mode-badge"></p>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon only-m" id="side-toggle" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1 id="page-title">Dashboard</h1>
        <span class="who" id="who"></span>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div class="modal" id="modal" hidden><div class="modal-card" id="modal-card"></div></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
